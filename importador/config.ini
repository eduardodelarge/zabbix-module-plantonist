[planilha]
; Caminho completo da planilha (.xlsx ou .csv).
; No Windows use barras normais: C:/Users/eduardo/escala/escala.xlsx
caminho = /home/eduardo/Documents/zabbix-module-plantonist/importador/escala_exemplo.csv
; Nome da aba. Deixe em branco para usar a primeira.
aba =

[banco]
; MySQL / MariaDB:
url = mysql+pymysql://plantonista_imp:zabbix@127.0.0.1:3306/zabbix
; PostgreSQL (exemplo - requer psycopg2-binary):
; url = postgresql+psycopg2://plantonista_imp:TROQUE_ESTA_SENHA@10.0.0.5:5432/zabbix

[opcoes]
; true  = aborta a importacao se houver periodos sobrepostos para a mesma aplicacao
; false = apenas exibe um aviso e importa mesmo assim
sobreposicao_fatal = false
